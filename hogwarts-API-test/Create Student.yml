info:
  name: Create Student
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/students
  body:
    type: json
    data: |-
      {
        "name": "Harry Potter",
        "house": "Gryffindor"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
